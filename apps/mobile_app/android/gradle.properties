org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 compiles Kotlin itself. firebase_core and firebase_crashlytics only
# apply the Kotlin Gradle Plugin when this is false. Keep it true.
android.builtInKotlin=true
# R8 full mode is the only mode in AGP 9. Release builds turn it on with
# proguard-android-optimize.txt, which shrinks and optimizes dex.
# 16 KB pages: flutter.ndkVersion is NDK r28, whose linker aligns native code
# to 16 KB. Native libraries stay uncompressed (useLegacyPackaging = false).
